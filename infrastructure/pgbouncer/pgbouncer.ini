[databases]
auth_db = host=masr3-auth-db port=5432 dbname=auth_db
notification_db = host=masr3-notification-db port=5432 dbname=notification_db
trip_db = host=masr3-trip-db port=5432 dbname=trip_db
audit_db = host=masr3-audit-db port=5432 dbname=audit_db

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
# plain: pgbouncer holds the real password and can complete whichever
# challenge the backend asks for (scram-sha-256 or md5) - no need to
# pre-hash passwords or touch the postgres role after creation.
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
admin_users = auth
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
