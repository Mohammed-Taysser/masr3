name: masr3

# Port convention (host-published only; container-internal ports keep image defaults):
#   41000-41099  databases
#   41500        pgbouncer
#   42000-42099  kafka
#   43000-43099  db/infra ui
#   45000-45099  dev-only tools
#
# Infrastructure only — no application services here.
#
# All infrastructure services share the "masr3-network" network.
# Application services can join this network from their own Compose files
# using:
#
# networks:
#   masr3-network:
#     external: true

services:
  # ========================================
  # Databases
  # ========================================

  auth-db:
    image: postgres:16-alpine
    container_name: masr3-auth-db
    restart: unless-stopped

    env_file:
      - ./apps/auth-service/db.env

    # Server and container clock in UTC; timestamptz values are stored as UTC regardless.
    environment:
      TZ: UTC

    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']

    ports:
      - '41000:5432'

    volumes:
      - masr3_auth_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  notification-db:
    image: postgres:16-alpine
    container_name: masr3-notification-db
    restart: unless-stopped

    env_file:
      - ./apps/notification-service/db.env

    # Server and container clock in UTC; timestamptz values are stored as UTC regardless.
    environment:
      TZ: UTC

    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']

    ports:
      - '41001:5432'

    volumes:
      - masr3_notification_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  trip-db:
    image: postgres:16-alpine
    container_name: masr3-trip-db
    restart: unless-stopped

    env_file:
      - ./apps/trip-service/db.env

    # Server and container clock in UTC; timestamptz values are stored as UTC regardless.
    environment:
      TZ: UTC

    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']

    ports:
      - '41002:5432'

    volumes:
      - masr3_trip_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  audit-db:
    image: postgres:16-alpine
    container_name: masr3-audit-db
    restart: unless-stopped

    env_file:
      - ./apps/audit-service/db.env

    # Server and container clock in UTC; timestamptz values are stored as UTC regardless.
    environment:
      TZ: UTC

    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']

    ports:
      - '41003:5432'

    volumes:
      - masr3_audit_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  vehicle-db:
    image: postgres:16-alpine
    container_name: masr3-vehicle-db
    restart: unless-stopped

    env_file:
      - ./apps/vehicle-service/db.env

    # Server and container clock in UTC; timestamptz values are stored as UTC regardless.
    environment:
      TZ: UTC

    command: ['postgres', '-c', 'timezone=UTC', '-c', 'log_timezone=UTC']

    ports:
      - '41004:5432'

    volumes:
      - masr3_vehicle_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  # ========================================
  # PgBouncer
  # ========================================
  #
  # PgBouncer fronts the PostgreSQL instances.
  #
  # Container-internal address:
  #   masr3-pgbouncer:6432
  #
  # Host address:
  #   localhost:41500
  #
  # PgBouncer must use Docker DNS names for PostgreSQL:
  #   masr3-auth-db:5432
  #   masr3-notification-db:5432
  #   masr3-trip-db:5432
  #

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: masr3-pgbouncer
    restart: unless-stopped

    ports:
      - '41500:6432'

    volumes:
      - ./infrastructure/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./infrastructure/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro

    depends_on:
      auth-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      trip-db:
        condition: service_healthy
      audit-db:
        condition: service_healthy
      vehicle-db:
        condition: service_healthy

    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 6432 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - masr3-network

  # ========================================
  # DB / Infrastructure UI
  # ========================================

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: masr3-pgadmin
    restart: unless-stopped

    env_file:
      - ./infrastructure/ui/pgadmin.env

    ports:
      - '43000:80'

    volumes:
      - masr3_pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/ui/servers.json:/pgadmin4/servers.json:ro

    depends_on:
      auth-db:
        condition: service_healthy
      notification-db:
        condition: service_healthy
      trip-db:
        condition: service_healthy
      audit-db:
        condition: service_healthy

    networks:
      - masr3-network

  # ========================================
  # Messaging
  # ========================================

  kafka:
    image: apache/kafka:3.9.0
    container_name: masr3-kafka
    restart: unless-stopped

    env_file:
      - ./infrastructure/kafka.env

    ports:
      - '42000:9094'

    volumes:
      - masr3_kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - masr3-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: masr3-kafka-ui
    restart: unless-stopped

    environment:
      KAFKA_CLUSTERS_0_NAME: masr3
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: masr3-kafka:9092

    ports:
      - '42001:8080'

    depends_on:
      kafka:
        condition: service_healthy

    networks:
      - masr3-network

  # ========================================
  # Queues
  # ========================================

  # BullMQ's store. AOF persistence keeps delayed jobs across restarts, and
  # BullMQ requires noeviction: an evicted key is a lost job.
  redis:
    image: redis:7.4-alpine
    container_name: masr3-redis
    restart: unless-stopped

    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory-policy',
        'noeviction',
      ]

    ports:
      - '44000:6379'

    volumes:
      - masr3_redis_data:/data

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - masr3-network

  bull-board:
    image: venatum/bull-board:3.4.13
    container_name: masr3-bull-board
    restart: unless-stopped

    environment:
      REDIS_HOST: masr3-redis
      REDIS_PORT: 6379
      BULL_VERSION: BULLMQ

    ports:
      - '44001:3000'

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - masr3-network

  # ========================================
  # Dev-only tools
  # ========================================

  mailhog:
    image: mailhog/mailhog:latest
    container_name: masr3-mailhog
    restart: unless-stopped

    ports:
      - '45000:1025'
      - '45001:8025'

    networks:
      - masr3-network

# ========================================
# Volumes
# ========================================

volumes:
  masr3_auth_db_data:
    name: masr3_auth_db_data

  masr3_notification_db_data:
    name: masr3_notification_db_data

  masr3_trip_db_data:
    name: masr3_trip_db_data

  masr3_audit_db_data:
    name: masr3_audit_db_data

  masr3_vehicle_db_data:
    name: masr3_vehicle_db_data

  masr3_kafka_data:
    name: masr3_kafka_data

  masr3_pgadmin_data:
    name: masr3_pgadmin_data

  masr3_redis_data:
    name: masr3_redis_data

# ========================================
# Shared Network
# ========================================
#
# Explicit "name" is important.
#
# Without it, Compose creates something like:
#   masr3_masr3-network
#
# With it, the actual Docker network is:
#   masr3-network
#
# Separate application Compose projects can therefore use:
#
# networks:
#   masr3-network:
#     external: true
#

networks:
  masr3-network:
    name: masr3-network
    driver: bridge
